<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Editing Studio Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 600px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 40px;
        }
        .hub-menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        /* Style the tabs as massive click blocks */
        .tool-link {
            display: block;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .tool-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .image-btn { background-color: #e74c3c; }
        .video-btn { background-color: #9b59b6; }
        .music-btn { background-color: #2ecc71; }
    </style>
</head>
<body>

    <h1>Creative Editing Studio Hub</h1>
    
    <div class="hub-menu">
        <!-- target="_blank" forces your browser to launch this in a brand new, empty full screen tab -->
        <a href="image.html" target="_blank" class="tool-link image-btn">🖼️ Launch Image Editor (Full Screen)</a>
        <a href="video.html" target="_blank" class="tool-link video-btn">🎬 Launch Video Editor (Full Screen)</a>
        <a href="music.html" target="_blank" class="tool-link music-btn">🎵 Launch Music Editor (Full Screen)</a>
    </div>

</body>
</html>
