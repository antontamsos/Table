<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Table Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .controls {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }
        label {
            font-weight: bold;
        }
        input[type="number"] {
            width: 60px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        #tableContainer {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        table, th, td {
            border: 1px solid #bdc3c7;
        }
        td {
            padding: 12px;
            text-align: center;
            background-color: #fafafa;
        }
        tr:nth-child(even) td {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>Dynamic Table Generator</h1>
    
    <div class="controls">
        <label for="rows">Rows:</label>
        <input type="number" id="rows" name="rows" value="3" min="1">
        
        <label for="cols">Columns:</label>
        <input type="number" id="cols" name="cols" value="3" min="1">
        
        <button onclick="generateTable()">Generate Table</button>
    </div>

    <div id="tableContainer"></div>

    <script>
        function generateTable() {
            var rows = document.getElementById('rows').value;
            var cols = document.getElementById('cols').value;
            var tableContainer = document.getElementById('tableContainer');
            
            // Validation check
            if (rows < 1 || cols < 1) {
                tableContainer.innerHTML = '<p style="color: red; text-align: center;">Please enter a number greater than 0.</p>';
                return;
            }

            var table = document.createElement('table');
            
            for (var i = 0; i < rows; i++) {
                var tr = document.createElement('tr');
                for (var j = 0; j < cols; j++) {
                    var td = document.createElement('td');
                    td.appendChild(document.createTextNode('Cell ' + (i + 1) + ',' + (j + 1)));
                    tr.appendChild(td);
                }
                table.appendChild(tr); // FIXED: This appends rows directly to your table structure
            }
            
            tableContainer.innerHTML = '';
            tableContainer.appendChild(table);
        }
    </script>
</body>
</html>
