<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Editing Studio Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 550px;
            margin: 80px auto;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            font-size: 32px;
            margin-bottom: 35px;
        }
        .launcher-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .launch-btn {
            display: block;
            width: 100%;
            padding: 18px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
            transition: transform 0.15s ease, filter 0.15s ease;
            box-sizing: border-box;
        }
        .launch-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.06);
        }
        .btn-image { background-color: #e74c3c; }
        .btn-video { background-color: #9b59b6; }
        .btn-music { background-color: #2ecc71; }
        .btn-download { background-color: #3498db; }
    </style>
</head>
<body>

    <h1>Creative Editing Studio Hub</h1>

    <div class="launcher-stack">
        <a class="launch-btn btn-image" href="image.html">🖼️ Launch Image Editor (Full Screen)</a>
        <a class="launch-btn btn-video" href="video.html">🎬 Launch Video Editor (Full Screen)</a>
        <a class="launch-btn btn-music" href="music.html">🎵 Launch Music Editor (Full Screen)</a>
        <a class="launch-btn btn-download" href="download.html">📥 Download Tool (Full Screen)</a>
    </div>

</body>
</html>
